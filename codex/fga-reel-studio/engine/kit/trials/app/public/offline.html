<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trials is off</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Same theme as the app (it stores light, dark or system here).
      try {
        const saved = localStorage.getItem("trialr-theme");
        const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <style>
      :root {
        --canvas: oklch(97.4% 0 0);
        --bg: oklch(100% 0 0);
        --ink: oklch(15% 0 0);
        --ink-2: oklch(46% 0 0);
        --ink-3: oklch(59% 0 0);
        --hover: oklch(96.2% 0 0);
        --accent: oklch(23% 0 0);
        --accent-ink: oklch(100% 0 0);
        --focus: oklch(55% 0.15 265);
        --sh-resting: 0 1px 2px oklch(0% 0 0 / 0.04), 0 0 0 1px oklch(0% 0 0 / 0.035);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --canvas: oklch(17% 0 0);
        --bg: oklch(21% 0 0);
        --ink: oklch(95% 0 0);
        --ink-2: oklch(76% 0 0);
        --ink-3: oklch(62% 0 0);
        --hover: oklch(25% 0 0);
        --accent: oklch(93% 0 0);
        --accent-ink: oklch(19% 0 0);
        --focus: oklch(72% 0.13 265);
        --sh-resting: 0 1px 2px oklch(0% 0 0 / 0.25), 0 0 0 1px oklch(100% 0 0 / 0.045);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font: 15px/1.6 Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px 32px 28px;
        border-radius: 14px;
        background: var(--bg);
        box-shadow: var(--sh-resting);
      }
      .mark { font: 600 15px/1 Geist, Inter, system-ui, sans-serif; letter-spacing: -0.02em; color: var(--ink-2); }
      h1 {
        margin: 22px 0 0;
        font: 600 30px/1.15 Geist, Inter, system-ui, sans-serif;
        letter-spacing: -0.035em;
      }
      p { margin: 10px 0 0; color: var(--ink-2); }
      button {
        margin-top: 24px;
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 500 14px/1.2 Inter, system-ui, sans-serif;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .help { margin-top: 18px; font-size: 13px; color: var(--ink-3); }
      code { white-space: nowrap; font: 12.5px/1 "JetBrains Mono", ui-monospace, monospace; padding: 2px 5px; border-radius: 5px; background: var(--hover); color: var(--ink-2); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🧪 Trials</div>
      <h1>Trials is off.</h1>
      <p>It turns off when your computer restarts. Your tests are safe: the history is saved on your computer and the posts are on Instagram.</p>
      <button id="start" type="button">Turn it back on</button>
      <p class="help" id="help">Button not working? Open Claude and type <code>/reel-kit:trials</code>.</p>
    </main>
    <script>
      const button = document.getElementById("start");
      const help = document.getElementById("help");

      // Back as soon as the server answers, however it was started.
      const check = async () => {
        try {
          const response = await fetch("/api/zernio/status", { cache: "no-store" });
          if (response.ok) location.reload();
        } catch {
          // Still off.
        }
      };
      setInterval(check, 2000);

      // Trials for Mac, when it is installed, answers trials:// links and starts the server.
      button.addEventListener("click", () => {
        button.disabled = true;
        button.textContent = "Turning it on…";
        location.href = "trials://start";
        setTimeout(() => {
          button.disabled = false;
          button.textContent = "Try again";
          help.innerHTML = "Still off. Open Claude and type <code>/reel-kit:trials</code>: it starts Trials and fixes whatever stopped it.";
        }, 8000);
      });
    </script>
  </body>
</html>
