<!-- finger-draw (cam): gen.py rewrites this file. finger.mp4 is the live footage for this window with the line drawn on
     it (frame 0 is the window's first frame, class g keeps the live grade). Run gen.py before the first build: until
     then there is no finger.mp4. -->
<video id="{{ID}}-v" class="g" src="fx/{{ID}}/finger.mp4" muted playsinline data-start="{{START}}" data-media-start="0.0010" data-duration="{{DUR}}" data-track-index="{{T0}}" style="position:absolute;left:0;top:0;width:1080px;height:1920px;"></video>
