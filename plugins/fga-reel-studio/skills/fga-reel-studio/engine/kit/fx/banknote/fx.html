<!-- banknote (over): gen.py rewrites this file. note.mp4 is the whole note for this window, pre-rendered (frame 0 is the
     window's first frame, the speaker's lips are the live frames). Run gen.py before the first build: until then there
     is no note.mp4. -->
<video id="{{ID}}-clip" src="fx/{{ID}}/note.mp4" muted playsinline data-start="{{START}}" data-media-start="0.0010" data-duration="{{DUR}}" data-track-index="{{T0}}" style="position:absolute;left:0;top:0;width:1080px;height:1920px;"></video>
