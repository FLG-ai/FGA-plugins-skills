<!-- follow-chip: the sign-off. A profile chip rises over the top edge of the captions band: the speaker's headshot,
     their handle, a Follow button that presses to Following on "follow", then a short line slides in under the handle
     on its word. Holds to the last frame. Generic profile UI in the creator's text-box colours (the same chip as
     comment-cta's); the handle, the headshot and the words are constants at the top of fx.js (gen.py fills in the
     handle and the headshot from the project). -->
<div class="fc-chip" data-layout-allow-overlap>
  <div class="fc-av"></div>
  <div class="fc-who"><div class="fc-handle" data-layout-allow-overlap></div><div class="fc-sub" data-layout-allow-overlap></div></div>
  <div class="fc-btn" data-layout-allow-overlap>
    <div class="fc-bl fc-b1" data-layout-allow-overlap><svg viewBox="0 0 30 30"><path class="fc-chk" d="M6 15.5 L12.5 22 L24.5 9"/></svg><span data-layout-allow-overlap></span></div>
    <div class="fc-bl fc-b0" data-layout-allow-overlap><span data-layout-allow-overlap></span></div>
  </div>
</div>
<style>
